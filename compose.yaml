# Runs the backend and PostgreSQL together.

services:
  database:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotel_booking

    ports:
      - "5433:5432"

    volumes:
      # Persistent PostgreSQL data.
      - postgres_data:/var/lib/postgresql/data

      # Creates hotel_booking_test when initializing a brand-new volume.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy

    command: sh -c "npm run db:migrate && npm start"

# Declares the named storage managed by Docker.
volumes:
  postgres_data: